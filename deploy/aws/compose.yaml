name: buywise
services:
  api:
    image: ${BACKEND_IMAGE:-buywise-backend:local}
    build:
      context: ../..
    env_file:
      - path: .env
        format: raw
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8000"
      # Safe only because api has no published port and this network is private.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped
    stop_grace_period: 110s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/aws/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/aws/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 110s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
